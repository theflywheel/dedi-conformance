name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the spec is a submodule; without it nothing runs
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      # The suite's own tests include the anti-vacuity checks: a conformant
      # mock must pass, and each injected defect must be caught by the case
      # meant to catch it. Weakening an assertion turns these red.
      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: docker build -t dedi-conformance:ci .
      # Prove the published image actually runs, rather than only that it built.
      - run: docker run --rm dedi-conformance:ci --help || true
