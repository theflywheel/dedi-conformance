name: publish-image
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip rather than fail where the registry credentials are absent — a fork
    # should not show a red build for lacking secrets it was never going to
    # have.
    if: github.repository == 'theflywheel/dedi-conformance'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the image embeds the pinned spec

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: flywheelai/dedi-conformance
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch on purpose: the maintainers build on arm64 and most
          # consumers run amd64, so a single-arch push works for whoever
          # published it and fails for everyone else.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
