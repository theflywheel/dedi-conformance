name: publish-image

# Releases only, deliberately. A conformance report is a claim about an
# implementation, and the claim is only meaningful if the suite that produced
# it can be named exactly and fetched again unchanged. Publishing on every push
# to main would keep moving `latest` underneath anyone who cited it, so a run
# from March and a run from June would report against different suites while
# naming the same image.
on:
  release:
    types: [published]
  # Republishing an existing release, e.g. after fixing registry credentials,
  # without cutting a version that says nothing changed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip rather than fail where the registry credentials are absent — a fork
    # should not show a red build for lacking secrets it was never going to
    # have.
    if: github.repository == 'theflywheel/dedi-conformance'
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, not the default branch: on a release event the default
          # checkout is already the tag, but the dispatch path needs it named.
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive   # the image embeds the pinned spec

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: flywheelai/dedi-conformance
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag || github.ref_name }}
            type=sha,format=short
            # `latest` tracks the newest release, and only a full one: a
            # prerelease that claimed it would silently become the default
            # image for everyone who did not pin.
            type=raw,value=latest,enable=${{ github.event.release.prerelease != true }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch on purpose: the maintainers build on arm64 and most
          # consumers run amd64, so a single-arch push works for whoever
          # published it and fails for everyone else.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
